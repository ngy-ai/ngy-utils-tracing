[package]
name = "ngy-utils-tracing"
version = "0.6.0"
edition = "2024"
authors = ["Ngy <taoistwar@gmail.com>"]
license = "MIT"
description = "Tracing-based logging initialization utility that selects console/file/test logging by application mode (APP_MODE)."
readme = "README.md"
keywords = ["tracing", "logging", "log", "observability", "structured-logging"]
categories = ["development-tools"]
documentation = "https://docs.rs/ngy-utils-tracing"
repository = "https://github.com/ngy-ai/ngy-utils-tracing"
# Exclude the log directory generated by test runs from being packaged into the crate
exclude = ["logs"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
  "time",
] }
# Used directly (instead of `SubscriberInitExt::try_init`) so that the `log` compatibility layer is
# best effort: an application that already installed a `log` logger must not break `init()`.
# Already in the graph via tracing-subscriber's default features, so this adds no build cost.
tracing-log = "0.2"
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "macros"] }
dotenvy = "0.15"
anyhow = "1.0.104"

[dev-dependencies]
# Used by tests that install a `log` logger before calling `init()`.
log = "0.4"
